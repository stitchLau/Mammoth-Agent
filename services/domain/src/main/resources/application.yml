spring:
  application:
    name: mammoth-domain-service

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        format_sql: false

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

server:
  port: ${MAMMOTH_SERVER_PORT:8080}

mammoth:
  # Empty means "use the OS application-data default" (see DataRootResolver).
  # Set MAMMOTH_DATA_ROOT or this property to choose an explicit data directory.
  data-root: ${MAMMOTH_DATA_ROOT:}
  # ADR-0008: read-only entrypoints (MCP) must not create data, run Flyway or take the writer lock.
  # The MCP entrypoint forces this to true; it is exposed for controlled read-only diagnostics.
  data-root.read-only: ${MAMMOTH_DATA_ROOT_READ_ONLY:false}
  # ADR-0008: allow network/cloud-synced data roots. Unsafe for SQLite; only for controlled tests
  # or a documented one-off migration. Production must stay on a local fixed disk.
  data-root.allow-unsupported: ${MAMMOTH_ALLOW_UNSUPPORTED_ROOT:false}
  default-org-name: ${MAMMOTH_ORG_NAME:Mammoth Demo}
  mcp:
    # Temporary agent identity for the MCP stdio entrypoint (pre-authentication stage).
    # The user must be an active project member; only verified knowledge is exposed.
    agent-user-id: ${MAMMOTH_MCP_AGENT_USER_ID:}
  web:
    # Optional explicit SPA dist directory; empty probes apps/web/dist relative to the working dir.
    dist: ${MAMMOTH_WEB_DIST:}
  notifications:
    in-app:
      enabled: ${MAMMOTH_NOTIFICATIONS_IN_APP_ENABLED:true}
    # ADR-0013: full channel implementations, disabled by default. Enable only with explicit config.
    email:
      enabled: ${MAMMOTH_NOTIFICATIONS_EMAIL_ENABLED:false}
      from: ${MAMMOTH_NOTIFICATIONS_EMAIL_FROM:}
      test-recipient: ${MAMMOTH_NOTIFICATIONS_EMAIL_TEST_RECIPIENT:}
    wecom:
      enabled: ${MAMMOTH_NOTIFICATIONS_WECOM_ENABLED:false}
      webhook-url: ${MAMMOTH_NOTIFICATIONS_WECOM_WEBHOOK_URL:}
      msg-type: ${MAMMOTH_NOTIFICATIONS_WECOM_MSG_TYPE:markdown}
      events: ${MAMMOTH_NOTIFICATIONS_WECOM_EVENTS:agent.task.completed,agent.task.confirmation_required,job.failed}
      rate-limit-per-minute: ${MAMMOTH_NOTIFICATIONS_WECOM_RATE_LIMIT:20}
      test-webhook-url: ${MAMMOTH_NOTIFICATIONS_WECOM_TEST_WEBHOOK_URL:}
  jobs:
    # Writer-only outbox worker; the read-only MCP entrypoint does not schedule it.
    poll-interval-ms: ${MAMMOTH_JOBS_POLL_INTERVAL_MS:5000}
    initial-delay-ms: ${MAMMOTH_JOBS_INITIAL_DELAY_MS:10000}
  jira:
    # M4.5-1 read-only Data Center connector. Token is required only at call time; empty = disabled.
    base-url: ${MAMMOTH_JIRA_BASE_URL:http://119.145.133.146:18009}
    token: ${MAMMOTH_JIRA_TOKEN:}
    jql: ${MAMMOTH_JIRA_JQL:updated >= -30d ORDER BY updated DESC}
    max-results: ${MAMMOTH_JIRA_MAX_RESULTS:100}
    page-size: ${MAMMOTH_JIRA_PAGE_SIZE:50}

logging:
  level:
    root: INFO
    com.mammoth: INFO
