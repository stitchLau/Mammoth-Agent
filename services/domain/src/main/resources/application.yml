spring:
  application:
    name: mammoth-domain-service

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        format_sql: false

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

server:
  port: ${MAMMOTH_SERVER_PORT:8080}

mammoth:
  # Empty means "use the OS application-data default" (see DataRootResolver).
  # Set MAMMOTH_DATA_ROOT or this property to choose an explicit data directory.
  data-root: ${MAMMOTH_DATA_ROOT:}
  default-org-name: ${MAMMOTH_ORG_NAME:Mammoth Demo}
  mcp:
    # Temporary agent identity for the MCP stdio entrypoint (pre-authentication stage).
    # The user must be an active project member; only verified knowledge is exposed.
    agent-user-id: ${MAMMOTH_MCP_AGENT_USER_ID:}
  web:
    # Optional explicit SPA dist directory; empty probes apps/web/dist relative to the working dir.
    dist: ${MAMMOTH_WEB_DIST:}

logging:
  level:
    root: INFO
    com.mammoth: INFO
