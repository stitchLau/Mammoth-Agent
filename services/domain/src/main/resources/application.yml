spring:
  application:
    name: mammoth-domain-service

server:
  port: ${MAMMOTH_SERVER_PORT:8080}

mammoth:
  # Empty means "use the OS application-data default" (see DataRootResolver).
  # Set MAMMOTH_DATA_ROOT or this property to choose an explicit data directory.
  data-root: ${MAMMOTH_DATA_ROOT:}

logging:
  level:
    root: INFO
    com.mammoth: INFO
