name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Domain Service (Java 17)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/domain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify
        run: mvn -B -ntp verify

  web:
    name: Web UI (Node 24)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  e2e:
    name: Browser E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Build backend jar
        run: mvn -B -ntp -DskipTests -f services/domain/pom.xml package
      - name: Install and build web
        working-directory: apps/web
        run: npm ci && npm run build
      - name: Install Playwright browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Start backend
        run: |
          java -jar services/domain/target/mammoth-domain-service.jar \
            --server.port=18130 \
            --mammoth.data-root="$RUNNER_TEMP/mammoth-e2e" \
            > backend-e2e.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:18130/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:18130/api/health
      - name: Run browser E2E
        working-directory: apps/web
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
